<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="化身白鹤飞入一卷褪色的青绿山水，飞过之处重新着色，寻得十处景致后长卷复原。">
<style>body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>鹤游江山</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* layout: a full-bleed painting; type and seals sit on it like colophons on a handscroll */
:root{
  --silk:#dcc998; --silk-lit:#eadfbd; --silk-deep:#b4955c;
  --ink:#211c16; --ink-wash:#5a4e3e;
  --cinnabar:#b23a2b; --azurite:#1f4f8f; --malachite:#2f8a6c; --wood:#6b4a2a;
  --f-brush:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",cursive;
  --f-text:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
html,body{height:100%}
body{margin:0;background:var(--silk);color:var(--ink);font-family:var(--f-text);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.gone{opacity:0!important;pointer-events:none!important}
#veil{position:fixed;inset:0;background:var(--silk);opacity:0;pointer-events:none;transition:opacity .9s ease}
#veil.on{opacity:1}

#loading{position:fixed;inset:0;background:var(--silk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 1.2s ease;z-index:5}
#loading .dot{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#3a332a,var(--ink) 60%);animation:grind 2.4s ease-in-out infinite}
@keyframes grind{0%,100%{transform:scale(.82);opacity:.75}50%{transform:scale(1);opacity:1}}
#ld-text{font-size:15px;letter-spacing:.4em;color:var(--ink-wash);margin:0;padding-left:.4em}

#title{position:fixed;inset:0;display:flex;justify-content:space-between;align-items:stretch;gap:24px;
  padding-block:max(28px,6vh);padding-left:max(24px,5vw,env(safe-area-inset-left,0px));padding-right:max(24px,5vw,env(safe-area-inset-right,0px));
  background:linear-gradient(90deg,rgba(220,201,152,.80) 0,rgba(220,201,152,0) 42%,rgba(220,201,152,0) 66%,rgba(220,201,152,.82) 100%);
  transition:opacity 1.4s ease}
.t-left{align-self:flex-end;max-width:25em;min-width:0}
.lede{font-size:clamp(14px,2.1vh,17px);line-height:2;letter-spacing:.14em;margin:0 0 22px;color:var(--ink)}
#btn-start{font-family:var(--f-brush);font-size:clamp(24px,4vh,32px);letter-spacing:.3em;padding:.28em 1.1em .34em 1.4em;color:var(--silk-lit);background:var(--cinnabar);border:0;border-radius:3px;cursor:pointer;
  box-shadow:inset 0 0 0 2px rgba(234,223,189,.45),0 4px 14px rgba(33,28,22,.3);transition:transform .2s,box-shadow .2s}
#btn-start:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px rgba(234,223,189,.7),0 8px 20px rgba(33,28,22,.35)}
#btn-start:focus-visible,.e-btn:focus-visible,#btn-mute:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.keys-hint{font-size:12.5px;letter-spacing:.16em;color:var(--ink-wash);margin:18px 0 0}
.t-right{writing-mode:vertical-rl;max-height:100%}
#title h1{font-family:var(--f-brush);font-weight:400;font-size:clamp(60px,17vh,150px);line-height:1.02;margin:0 0 0 .08em;letter-spacing:.06em;white-space:nowrap;color:var(--ink);text-shadow:0 0 22px rgba(234,223,189,.95),0 0 3px rgba(234,223,189,.8)}
.t-sub{font-size:clamp(12px,1.9vh,16px);letter-spacing:.42em;color:var(--ink-wash);padding-top:.5em;white-space:nowrap}
.seal{writing-mode:horizontal-tb;direction:rtl;display:inline-grid;grid-auto-flow:column;grid-template-rows:1fr 1fr;width:2.5em;height:2.5em;background:var(--cinnabar);color:var(--silk-lit);
  font-family:var(--f-brush);font-size:clamp(15px,2.5vh,22px);line-height:1.2em;text-align:center;border-radius:3px;padding:.08em;box-shadow:inset 0 0 0 1.5px rgba(234,223,189,.5);margin:1.4em 0 0 0;letter-spacing:0;vertical-align:top;transform:rotate(-1.5deg)}

#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .9s ease}
#top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#stats{display:flex;gap:16px;font-size:13.5px;letter-spacing:.14em;background:rgba(234,223,189,.80);border:1px solid rgba(33,28,22,.26);padding:6px 13px;border-radius:2px;font-variant-numeric:tabular-nums}
#stats b{font-weight:600}
#seals{display:flex;flex-direction:row-reverse;gap:5px}
#seals i{width:25px;height:25px;border:1px solid rgba(33,28,22,.38);font-style:normal;font-family:var(--f-brush);font-size:17px;line-height:25px;text-align:center;color:transparent;background:rgba(234,223,189,.55);border-radius:2px;transition:background .7s,color .7s,transform .7s,border-color .7s}
#seals i.on{background:var(--cinnabar);color:var(--silk-lit);border-color:var(--cinnabar);transform:rotate(-3deg)}
#toast{position:absolute;top:17%;left:0;right:0;text-align:center;opacity:0;transition:opacity 1s ease;padding-inline:16px}
#toast.show{opacity:1}
.t-name{font-family:var(--f-brush);font-size:clamp(42px,10vh,88px);letter-spacing:.14em;padding-left:.14em;color:var(--ink);text-shadow:0 0 26px rgba(234,223,189,1),0 0 5px rgba(234,223,189,.95);line-height:1.1}
.t-desc{font-size:clamp(14px,2.3vh,18px);letter-spacing:.34em;margin-top:.5em;color:var(--ink);text-shadow:0 0 12px rgba(234,223,189,1),0 0 3px rgba(234,223,189,1)}
.t-tag{display:inline-block;font-family:var(--f-brush);font-size:clamp(13px,2vh,17px);background:var(--cinnabar);color:var(--silk-lit);padding:.1em .5em .16em;border-radius:2px;letter-spacing:.2em;margin-bottom:.5em;transform:rotate(-2deg)}
#bottom{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:9px;padding-inline:16px}
#story{font-size:clamp(14px,2.4vh,19px);letter-spacing:.26em;text-align:center;opacity:0;transition:opacity 1.1s ease;text-shadow:0 0 12px rgba(234,223,189,1),0 0 3px rgba(234,223,189,1);min-height:1.6em}
#story.show{opacity:1}
#guide{display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.16em;background:rgba(234,223,189,.78);border:1px solid rgba(33,28,22,.24);padding:3px 12px 3px 8px;border-radius:999px;font-variant-numeric:tabular-nums;transition:opacity .6s}
#g-arrow{display:inline-block;width:18px;height:18px}
#g-arrow svg{display:block;width:18px;height:18px}
#scroll{display:flex;align-items:stretch;filter:drop-shadow(0 3px 7px rgba(33,28,22,.38))}
#map{width:min(400px,56vw);aspect-ratio:920/358;height:auto;display:block;border-block:5px solid var(--wood);background:var(--silk)}
.roller{width:10px;background:linear-gradient(90deg,#3a2817,#8a6238 45%,#3a2817);border-radius:3px;margin-block:-6px}
#keys{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.14em;line-height:1.9;text-align:right;color:var(--ink);text-shadow:0 0 8px rgba(234,223,189,1),0 0 2px rgba(234,223,189,1)}
#keys kbd{font-family:var(--f-text);font-size:11px;background:rgba(234,223,189,.85);border:1px solid rgba(33,28,22,.4);border-radius:3px;padding:0 5px;margin-inline:1px}
#btn-mute{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));pointer-events:auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(33,28,22,.4);background:rgba(234,223,189,.82);color:var(--ink);font-size:16px;cursor:pointer;font-family:var(--f-text)}
#btn-land{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));pointer-events:auto;height:34px;padding:0 13px 1px 16px;border-radius:17px;border:1px solid rgba(33,28,22,.4);background:rgba(234,223,189,.86);color:var(--ink);font-family:var(--f-text);font-size:13px;letter-spacing:.24em;cursor:pointer}
#btn-land:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#btn-mute.off{color:rgba(33,28,22,.35);text-decoration:line-through}
@media (max-width:760px){#keys{display:none}#stats{font-size:12px;gap:10px}#seals i{width:20px;height:20px;line-height:20px;font-size:14px}}

#ending{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));transition:opacity 1.4s ease}
.e-card{background:rgba(234,223,189,.90);border:1px solid rgba(33,28,22,.3);box-shadow:0 10px 40px rgba(33,28,22,.3);padding:clamp(22px,5vh,40px) clamp(24px,6vw,56px);text-align:center;max-width:30em;border-radius:2px}
.e-card h2{font-family:var(--f-brush);font-weight:400;font-size:clamp(40px,9vh,72px);margin:0 0 .2em;letter-spacing:.12em;padding-left:.12em;text-wrap:balance}
.e-card p{font-size:15px;line-height:2;letter-spacing:.16em;margin:0 0 1.2em}
.e-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.e-btn{font-family:var(--f-text);font-size:15px;letter-spacing:.24em;padding:.55em 1.3em .6em 1.5em;border-radius:3px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.e-btn.main{background:var(--cinnabar);border-color:var(--cinnabar);color:var(--silk-lit)}
@media (prefers-reduced-motion:reduce){#loading .dot{animation:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="青绿山水画卷，一只白鹤在其中飞行"></canvas>
<div id="veil"></div>

<section id="title" class="gone">
  <div class="t-left">
    <p class="lede">九百年过去，绢上的石青石绿渐渐褪了。<br>借你一双鹤翼，飞过之处，江山重新着色。<br>寻得十处景致，长卷便成。<br>想细看，就落下来。</p>
    <button id="btn-start" type="button">入画</button>
    <p class="keys-hint">W S 升降　A D 转向　空格 振翅　F 降落</p>
  </div>
  <div class="t-right">
    <h1>鹤游江山</h1>
    <div class="t-sub">仿北宋王希孟千里江山图意<span class="seal" aria-hidden="true"><span>千</span><span>里</span><span>江</span><span>山</span></span></div>
  </div>
</section>

<div id="hud" class="gone">
  <div id="top">
    <div id="stats"><span>寻景 <b id="st-found">0</b> / 10</span><span>着色 <b id="st-paint">0</b>%</span></div>
    <div id="seals"></div>
  </div>
  <div id="toast"><div class="t-tag">得一景</div><div class="t-name" id="t-name"></div><div class="t-desc" id="t-desc"></div></div>
  <div id="bottom">
    <div id="story"></div>
    <div id="guide"><span id="g-arrow"><svg viewBox="0 0 18 18"><path d="M9 1.5 L14.5 15 L9 11.6 L3.5 15 Z" fill="#b23a2b"/></svg></span><span id="g-text">下一景</span></div>
    <div id="scroll"><i class="roller"></i><canvas id="map" width="920" height="358" aria-label="长卷地图"></canvas><i class="roller"></i></div>
  </div>
  <div id="keys"><span id="keys-fly"><kbd>W</kbd><kbd>S</kbd> 升降　<kbd>A</kbd><kbd>D</kbd> 转向<br><kbd>空格</kbd> 振翅　<kbd>F</kbd> 降落　<kbd>M</kbd> 静音</span><span id="keys-land" hidden><kbd>A</kbd><kbd>D</kbd> 环顾　<kbd>W</kbd><kbd>S</kbd> 俯仰<br>滚轮 远近　<kbd>空格</kbd> 起飞</span></div>
  <button id="btn-mute" type="button" aria-label="静音开关">♪</button>
  <button id="btn-land" type="button">降落</button>
</div>

<section id="ending" class="gone">
  <div class="e-card">
    <h2>江山既成</h2>
    <p id="e-text">十景俱得，千里江山重着青绿。</p>
    <div class="e-row"><button class="e-btn main" id="btn-free" type="button">继续遨游</button><button class="e-btn" id="btn-again" type="button">再画一卷</button></div>
  </div>
</section>

<div id="loading"><div class="dot"></div><p id="ld-text">研墨</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){ $('ld-text').textContent='画具没有取到，请检查网络后刷新'; return; }

/* ───────────── world constants ───────────── */
const WX=5400, WZ=2100, CELL=6, NX=WX/CELL, NZ=WZ/CELL, X0=-WX/2, Z0=-WZ/2;
const SEED=1113;
let maxH=600;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=mulberry32(SEED);
const wrapPi=a=>{a=(a+Math.PI)%(Math.PI*2);if(a<0)a+=Math.PI*2;return a-Math.PI;};

/* ───────────── noise ───────────── */
function hash2(ix,iy){let n=(Math.imul(ix,374761393)+Math.imul(iy,668265263)+Math.imul(SEED,362437))|0;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return(n>>>0)/4294967296;}
const _n=[0,0,0];
function vnd(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const ux=fx*fx*fx*(fx*(fx*6-15)+10),uy=fy*fy*fy*(fy*(fy*6-15)+10);
  const dux=30*fx*fx*(fx*(fx-2)+1),duy=30*fy*fy*(fy*(fy-2)+1);
  const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);
  const k1=b-a,k2=c-a,k3=a-b-c+d;
  _n[0]=a+k1*ux+k2*uy+k3*ux*uy;_n[1]=dux*(k1+k3*uy);_n[2]=duy*(k2+k3*ux);return _n;}
const vn=(x,y)=>vnd(x,y)[0];
function fbm(x,y,oct){let s=0,a=.5,norm=0;for(let i=0;i<oct;i++){s+=a*(vn(x,y)*2-1);norm+=a;const nx=1.6*x+1.2*y,ny=-1.2*x+1.6*y;x=nx+17.3;y=ny-9.1;a*=.5;}return s/norm;}
function erosion(x,y,oct){let a=0,b=1,dx=0,dy=0,norm=0;for(let i=0;i<oct;i++){const n=vnd(x,y);dx+=n[1];dy+=n[2];a+=b*n[0]/(1+dx*dx+dy*dy);norm+=b;b*=.5;const nx=1.6*x+1.2*y,ny=-1.2*x+1.6*y;x=nx;y=ny;}return a/norm;}
function ridged(x,y,oct){let s=0,a=.5,norm=0,w=1;for(let i=0;i<oct;i++){let n=1-Math.abs(vn(x,y)*2-1);n*=n;s+=a*n*w;norm+=a;w=clamp(n*1.7,0,1);const nx=1.6*x+1.2*y,ny=-1.2*x+1.6*y;x=nx+3.7;y=ny+1.9;a*=.5;}return s/norm;}

/* ───────────── heightfield ───────────── */
const H=new Float32Array((NX+1)*(NZ+1));
const bump=(x,c,w)=>{const t=(x-c)/w;return Math.exp(-t*t);};
const zChannel=x=>50+185*Math.sin(x*0.0021+0.6)+80*Math.sin(x*0.0052+2.0);
const riverHalf=x=>56+30*(fbm(x*0.0031+7.3,2.2,2)*.5+.5)+170*bump(x,-2080,330)+115*bump(x,-1190,250)+90*bump(x,2280,260);
function landness(x,z){
  const w1=fbm(x*0.0013+11.3,z*0.0013+4.1,3),w2=fbm(x*0.0013-7.7,z*0.0013+19.2,3);
  const wx=x+w1*140,wz=z+w2*140;
  const cR=(Math.abs(wz-zChannel(wx))-riverHalf(wx))/230;
  const sv=Math.abs(fbm(wx*0.00105+3.7,wz*0.00105+8.2,3));
  const wet=smoothstep(-0.12,0.18,fbm(x*0.0009+21.5,z*0.0009+5.5,2));
  const cS=(sv-0.034*wet)/0.16+0.035*(1-wet);
  return Math.min(cR,cS,1);
}
function rawHeight(x,z){
  const c=landness(x,z);
  const e=clamp(Math.min((WX/2-Math.abs(x))/220,(WZ/2-Math.abs(z))/220),0,1),ef=e*e*(3-2*e);
  let h;
  if(c<=0)h=Math.max(-40,c*105);
  else{
    const t=smoothstep(0.07,0.62,c);
    const w1=fbm(x*0.003+31.3,z*0.003+4.1,2),w2=fbm(x*0.003-27.7,z*0.003+9.2,2);
    const wx=x+w1*65,wz=z+w2*65;
    const m=0.62*erosion(wx/430+5.2,wz/430+1.3,7)*1.9+0.38*ridged(wx/275+3.1,wz/275+7.7,5)*1.5;
    const amp=175+300*smoothstep(-0.35,0.45,fbm(x*0.0008+40.5,z*0.0011+40.5,2));
    const ms=m<0.85?m:0.85+0.3*(1-Math.exp(-(m-0.85)/0.3));
    h=c*34*(1-t*0.6)+t*amp*Math.pow(ms,1.75);
    h*=0.14+0.86*ef;
  }
  if(e<0.1)h=lerp(-8,h,e/0.1);
  return h;
}
function genHeights(){let i=0;for(let iz=0;iz<=NZ;iz++){const z=Z0+iz*CELL;for(let ix=0;ix<=NX;ix++,i++)H[i]=rawHeight(X0+ix*CELL,z);}}
function getH(x,z){const fx=(x-X0)/CELL,fz=(z-Z0)/CELL;if(fx<0||fz<0||fx>=NX||fz>=NZ)return -40;const ix=fx|0,iz=fz|0,tx=fx-ix,tz=fz-iz;const i=iz*(NX+1)+ix;const a=H[i],b=H[i+1],c=H[i+NX+1],d=H[i+NX+2];return(a+(b-a)*tx)*(1-tz)+(c+(d-c)*tx)*tz;}
function flatten(x,z,R,target){
  const ix0=Math.max(0,Math.floor((x-R-X0)/CELL)),ix1=Math.min(NX,Math.ceil((x+R-X0)/CELL));
  const iz0=Math.max(0,Math.floor((z-R-Z0)/CELL)),iz1=Math.min(NZ,Math.ceil((z+R-Z0)/CELL));
  for(let iz=iz0;iz<=iz1;iz++)for(let ix=ix0;ix<=ix1;ix++){const d=Math.hypot(X0+ix*CELL-x,Z0+iz*CELL-z);if(d<R){const i=iz*(NX+1)+ix;H[i]=lerp(H[i],target,smoothstep(R,R*0.55,d));}}
}
const slopeAt=(x,z)=>Math.hypot(getH(x+CELL,z)-getH(x-CELL,z),getH(x,z+CELL)-getH(x,z-CELL))/(2*CELL);

/* ───────────── landmarks: site search ───────────── */
const LM=[
 {id:'ferry',name:'野渡横舟',ch:'渡',desc:'渡口无人，一舟自横'},
 {id:'village',name:'渔村炊烟',ch:'村',desc:'三五人家，临水而居'},
 {id:'bridge',name:'长桥卧波',ch:'桥',desc:'一桥如带，横锁烟波'},
 {id:'hut',name:'松风草堂',ch:'堂',desc:'结庐松下，卧听风声'},
 {id:'fall',name:'飞瀑悬泉',ch:'瀑',desc:'素练千尺，自云间落'},
 {id:'temple',name:'山寺晚钟',ch:'寺',desc:'钟声出谷，暮色四合'},
 {id:'waterside',name:'水榭听涛',ch:'榭',desc:'凭栏一望，水天俱远'},
 {id:'angler',name:'孤舟独钓',ch:'钓',desc:'一竿在手，万顷随波'},
 {id:'summit',name:'云顶危亭',ch:'亭',desc:'亭在绝顶，伸手可及云'},
 {id:'sails',name:'远浦归帆',ch:'帆',desc:'片帆数点，载得斜阳归'},
];

    for(let ix=0;ix<=NX;ix++){let s=0,n=0;for(let k=0;k<=RB&&k<=NZ;k++){s+=tmpB[k*(NX+1)+ix];n++;}
      for(let iz=0;iz<=NZ;iz++){out[iz*(NX+1)+ix]=s/n;const add=iz+RB+1,sub=iz-RB;if(add<=NZ){s+=tmpB[add*(NX+1)+ix];n++;}if(sub>=0){s-=tmpB[sub*(NX+1)+ix];n--;}}}

function updateLanding(dt){
  land.t+=dt;const k=clamp(land.t/land.dur,0,1),e=k*k*(3-2*k);
  crane.pos.x=lerp(land.from.x,land.to.x,e);crane.pos.z=lerp(land.from.z,land.to.z,e);crane.pos.y=lerp(land.from.y,land.to.y+LEGS,e);
  const g=Math.max(-0.5,getH(crane.pos.x,crane.pos.z))+LEGS+(1-e)*5;if(crane.pos.y<g)crane.pos.y=g;
  crane.yaw=land.yaw0+(land.yaw1-land.yaw0)*smoothstep(0,0.6,k);
  crane.roll*=Math.exp(-dt*4);crane.pitch+=((k>0.62?0.5:-0.12)-crane.pitch)*(1-Math.exp(-dt*3));
  crane.flap+=((k>0.5?1:0.35)-crane.flap)*(1-Math.exp(-dt*5));crane.speed+=(24-crane.speed)*dt*1.5;
  dir.set(-Math.sin(crane.yaw),0,-Math.cos(crane.yaw));
  if(k>=1){
    mode='landed';land.idle=0;land.auto=1;crane.pos.copy(land.to);
    let near=null,nd=300;for(const L of LM){const d=Math.hypot(L.x-crane.pos.x,L.z-crane.pos.z);if(d<nd){nd=d;near=L;}}
    if(near&&nd>14){crane.yaw=Math.atan2(-(near.x-crane.pos.x),-(near.z-crane.pos.z));land.look.set((near.x-crane.pos.x)*0.15,0,(near.z-crane.pos.z)*0.15);if(land.look.length()>16)land.look.setLength(16);}
    else land.look.set(0,0,0);
    land.orb=Math.atan2(Math.sin(crane.yaw),Math.cos(crane.yaw));land.elev=0.34;land.dist=near?clamp(nd*0.2+30,32,58):38;
    crane.stand.position.copy(crane.pos);crane.stand.rotation.y=crane.yaw;showFlying(false);
    if(getH(crane.pos.x,crane.pos.z)<0.2)addRipple(crane.pos.x,crane.pos.z,1);
    say('落定了。拖动或按 A D 环顾，空格起飞',5.5);
  }
}
function updateLanded(dt){
  land.idle+=dt;
  const turn=(kd('KeyA','ArrowLeft')?1:0)-(kd('KeyD','ArrowRight')?1:0),tilt=(kd('KeyW','ArrowUp')?1:0)-(kd('KeyS','ArrowDown')?1:0);
  if(turn||tilt||drag.id!==null)land.auto=0;else land.auto=Math.min(1,land.auto+dt*0.25);
  land.orb+=dt*(turn*1.2+0.07*land.auto);land.elev=clamp(land.elev+tilt*dt*0.7,0.06,1.15);
  const tx=crane.pos.x+land.look.x,ty=crane.pos.y+8,tz=crane.pos.z+land.look.z,ce=Math.cos(land.elev);
  const wx=tx+Math.sin(land.orb)*ce*land.dist,wz=tz+Math.cos(land.orb)*ce*land.dist;let wy=ty+Math.sin(land.elev)*land.dist;
  const gy=Math.max(0,getH(wx,wz))+3;if(wy<gy)wy=gy;
  const k=1-Math.exp(-dt*3);camPos.x+=(wx-camPos.x)*k;camPos.y+=(wy-camPos.y)*k;camPos.z+=(wz-camPos.z)*k;
  camLook.x+=(tx-camLook.x)*k;camLook.y+=(ty-camLook.y)*k;camLook.z+=(tz-camLook.z)*k;
  camera.position.copy(camPos);camera.up.set(0,1,0);camera.lookAt(camLook);
  if(Math.abs(camera.fov-52)>0.05){camera.fov+=(52-camera.fov)*(1-Math.exp(-dt*3));camera.updateProjectionMatrix();}
  crane.standHead.rotation.x=Math.sin(time*0.8)*0.07;crane.standHead.rotation.y=Math.sin(time*0.37)*0.4;
  stamp(crane.pos.x,crane.pos.z,Math.min(470,210+land.idle*45),dt*1.5);
  crane.speed*=Math.exp(-dt*3);
}
function takeOff(){
  if(mode!=='landed')return;mode='fly';showFlying(true);crane.pos.y+=LEGS+0.3;crane.pitch=0.45;crane.roll=0;crane.speed=36;crane.boost=1;crane.flap=1;takeT=1.4;
  dir.set(-Math.sin(crane.yaw),0,-Math.cos(crane.yaw));audio.whoosh();setLandUI(false);emitDust(crane.pos,14);
}
function discover(L){
  L.found=true;foundN++;L.beacon.visible=false;blooms.push({x:L.x,z:L.z,t:0,R:700,d:4.6});
  $('t-name').textContent=L.name;$('t-desc').textContent=L.desc;$('toast').classList.add('show');toastTimer=5.2;
  $('seal-'+L.id).classList.add('on');$('st-found').textContent=foundN;audio.chime();emitDust(crane.pos,40);
  if(foundN===LM.length){state='ending';stT=0;}
}
function updatePlay(dt){
  stT+=dt;if(state==='play'&&foundN<LM.length)playTime+=dt;
  if(mode==='fly'){updateFlight(dt);updateCam(dt);}
  else if(mode==='landing'){updateLanding(dt);if(mode==='landing')updateCam(dt);}
  else updateLanded(dt);
  if(mode!=='landed'){stamp(crane.pos.x,crane.pos.z,205,dt*2.3);
    dustT-=dt;if(dustT<=0){emitDust(tmpV.copy(crane.pos).addScaledVector(dir,-4),2);dustT=0.05;}}
  for(let i=blooms.length-1;i>=0;i--){const b=blooms[i];b.t+=dt;const t=clamp(b.t/b.d,0,1),e=1-Math.pow(1-t,2.2);stamp(b.x,b.z,lerp(110,b.R,e),dt*1.7);if(b.t>b.d+1.2)blooms.splice(i,1);}
  for(const L of LM)if(!L.found&&Math.hypot(L.x-crane.pos.x,L.z-crane.pos.z)<L.r&&Math.abs(crane.pos.y-L.y)<300)discover(L);
  while(storyQ.length&&stT>storyQ[0][0]&&state==='play'){const s=storyQ.shift();say(s[1],s[2]);}
  if(state==='ending'){
    U.uGlobal.value=smoothstep(0.5,7.5,stT);
    if(stT>1&&stT<1.1)say('十景俱得，丹青复还',6);
    if(stT>8&&!endShown){endShown=true;const m=Math.floor(playTime/60),s=Math.floor(playTime%60);$('e-text').textContent='十景俱得，千里江山重着青绿。历时 '+(m?m+' 分 ':'')+s+' 秒。';$('ending').classList.remove('gone');cover.fill(1);coverN=cover.length;}
  }
  U.uSkyTint.value+=(Math.max(U.uGlobal.value,coverN/cover.length)-U.uSkyTint.value)*dt*0.8;
  hudT-=dt;if(hudT<=0){hudT=0.25;$('st-paint').textContent=Math.round(coverN/cover.length*100);
    let best=null,bd=1e9;for(const L of LM)if(!L.found){const d=Math.hypot(L.x-crane.pos.x,L.z-crane.pos.z);if(d<bd){bd=d;best=L;}}
    const gd=$('guide');if(best){gd.style.opacity=1;const dx=best.x-crane.pos.x,dz=best.z-crane.pos.z,r=dx*Math.cos(crane.yaw)-dz*Math.sin(crane.yaw),fw=-dx*Math.sin(crane.yaw)-dz*Math.cos(crane.yaw);
      $('g-arrow').style.transform='rotate('+Math.atan2(r,fw)+'rad)';$('g-text').textContent='下一景　约 '+Math.max(10,Math.round(bd/3.3/10)*10)+' 丈';}else gd.style.opacity=0;}
  mapT-=dt;if(mapT<=0){mapT=0.09;drawMap();}
  audio.tick(mode==='landed'?40:crane.speed);
}
let tPrev=0,perfAcc=0,perfN=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-tPrev)/1000);tPrev=now;if(!(dt>0))dt=0.016;
  time+=dt;U.uTime.value=time;
  if(state==='title')updateTitle(dt);else if(state==='intro')updateIntro(dt);else if(state==='play'||state==='ending')updatePlay(dt);else return;
  poseCrane(dt);updateDust(dt);updateSmoke(dt);updateBirds(time);
  for(const f of floaters){f.m.position.y=Math.sin(time*0.9+f.ph)*0.35-0.1;f.m.rotation.z=Math.sin(time*0.7+f.ph)*0.03;f.m.rotation.y=f.ry+Math.sin(time*0.13+f.ph)*0.12;}
  const pu=0.05+Math.sin(time*2.6)*0.008;for(const L of LM)if(L.beacon.visible)L.beacon.scale.setScalar(pu);
  if(storyTimer>0){storyTimer-=dt;if(storyTimer<=0)$('story').classList.remove('show');}
  if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('show');}
  render();
  perfAcc+=dt;perfN++;if(perfN>=90){const avg=perfAcc/perfN;perfAcc=0;perfN=0;if(avg>0.030&&DPR>0.8){DPR=Math.max(0.8,DPR-0.25);resize();}}
}

/* ───────────── boot ───────────── */
const step=msg=>new Promise(r=>{$('ld-text').textContent=msg;setTimeout(r,45);});
async function boot(){
  await step('铺绢');genHeights();
  await step('勾勒山形');placeLandmarks();placeDetails();
  objMat=makeObjMat();treeMat=makeObjMat({tint:true});craneMat=makeObjMat({always:true});
  await step('皴擦点染');buildTerrain();buildWaterSky();
  await step('栽松置亭');buildLandmarks();buildDetails();buildTrees();buildCrane();buildStandingCrane();buildDust();buildSmoke();buildBeacons();buildClouds();buildBirds();
  await step('装裱');buildMinimap();buildPost();clearPaint();resize();
  const sl=$('seals');LM.forEach(L=>{const i=document.createElement('i');i.id='seal-'+L.id;i.textContent=L.ch;i.title=L.name;sl.appendChild(i);});
  const br=LM[2];titleC={x:br.x,z:br.z};
  U.uGlobal.value=1;U.uSkyTint.value=1;crane.flap=0.1;
  await step('调色，稍候片刻');
  const tc0=performance.now();state='title';updateTitle(0.016);poseCrane(0.016);render();
  console.info('first render ms',Math.round(performance.now()-tc0));
  tPrev=performance.now();requestAnimationFrame(frame);
  setTimeout(()=>{$('loading').classList.add('gone');$('title').classList.remove('gone');},120);
}
$('btn-start').addEventListener('click',()=>{if(state!=='title')return;audio.init();$('title').classList.add('gone');state='intro';stT=0;canvas.focus();
  $('hud').classList.remove('gone');['top','scroll','guide','keys','btn-land'].forEach(id=>{$(id).style.opacity=0;});
  say('岁月侵寻，丹青褪尽',4.2);
  setTimeout(()=>{['top','scroll','keys','btn-land'].forEach(id=>{$(id).style.transition='opacity 1.2s';$(id).style.opacity=1;});},5600);});
$('btn-mute').addEventListener('click',()=>audio.setMuted(!audio.muted));
$('btn-land').addEventListener('click',()=>{toggleLand();canvas.focus();});
$('btn-free').addEventListener('click',()=>{$('ending').classList.add('gone');state='play';canvas.focus();say('江山已成，随意遨游',5);});
$('btn-again').addEventListener('click',()=>{
  $('ending').classList.add('gone');clearPaint();blooms.length=0;foundN=0;endShown=false;playTime=0;stT=0;storyQ.length=0;
  for(const L of LM){L.found=false;L.beacon.visible=true;$('seal-'+L.id).classList.remove('on');}
  $('st-found').textContent=0;U.uGlobal.value=0;U.uSkyTint.value=0;startPos();snapCam();state='play';canvas.focus();
  blooms.push({x:crane.pos.x,z:crane.pos.z,t:0,R:380,d:3});say('再画一卷',4);});
window.__game={go(){$('title').classList.add('gone');beginPlay();},LM,crane,U,land,details,get state(){return state;},get mode(){return mode;},getH,discover,toggleLand,
  tp(x,z,y){if(mode!=='fly'){mode='fly';showFlying(true);setLandUI(false);}crane.pos.set(x,y===undefined?Math.max(0,getH(x,z))+80:y,z);snapCam();},camera};
boot().catch(e=>{console.error(e);$('ld-text').textContent='画卷没能展开：'+(e&&e.message||e);});
})();
</script>
